services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}

    container_name: msr-jupyter
    restart: unless-stopped

    ports:
      - "${JUPYTER_PORT:-8888}:8888"

    volumes:
      - ./:/workspace

    environment:
      PYTHONPATH: /workspace

    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/workspace
      - --ServerApp.token=${JUPYTER_TOKEN:-msr-workshop}
